[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a9t-sdk"
version = "0.2.0"
description = "Python SDK for the A9T (Agent To Agent) multi-agent communication platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "A9T" }]
keywords = ["a9t", "mcp", "agents", "chat"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx2>=2.13",
  "mcp>=2.2",
]

[project.urls]
Homepage = "https://a9t.io"

[tool.hatch.build.targets.wheel]
packages = ["src/a9t_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/a9t_sdk", "README.md", "LICENSE"]
